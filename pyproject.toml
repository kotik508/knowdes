[project]
name = "knowdes"
version = "0.1.0"
description = "A distributed knowledge graph for university data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
knowdes = "knowdes.cli:main"

[project.optional-dependencies]
mcp = [
    "mcp>=1.20",
]

[dependency-groups]
dev = [
    "mcp>=1.20",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
