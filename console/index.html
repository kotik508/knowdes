<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knowdes console</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #dddbd5;
    --leader: #1f6f4a; --candidate: #a3620a; --follower: #3b4a6b; --down: #b3b1ab; --bad: #a3261f;
    font: 14px/1.4 system-ui, sans-serif;
  }
  body { margin: 0; background: var(--bg); color: var(--ink); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; }
  header h1 { font-size: 16px; margin: 0; }
  header span { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; padding: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; }
  h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  #nodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .node { border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .node.down { color: var(--down); }
  .node.paused { border-style: dashed; }
  .node b { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .node b button { font-size: 12px; padding: 1px 6px; }
  .replica { display: grid; grid-template-columns: 64px 1fr; gap: 4px; font-variant-numeric: tabular-nums; }
  .role-leader { color: var(--leader); font-weight: 600; }
  .role-candidate { color: var(--candidate); }
  .role-follower { color: var(--follower); }
  #timeline { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow: auto; font: 12px/1.5 ui-monospace, monospace; }
  #timeline li { border-bottom: 1px solid var(--line); padding: 2px 0; }
  #timeline .t { color: var(--muted); }
  #timeline li.hidden { display: none; }
  .filters { display: flex; gap: 12px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .filters label { color: var(--muted); }
  form { display: grid; grid-template-columns: 90px 1fr; gap: 6px; align-items: center; }
  input, select, button { font: inherit; padding: 4px 6px; }
  button { grid-column: 2; justify-self: start; }
  pre { background: var(--bg); padding: 8px; overflow: auto; max-height: 30vh; font-size: 12px; }
  .error { color: var(--bad); }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>knowdes</h1><span id="conn">connecting</span></header>
<main>
  <div>
    <section><h2>Cluster</h2><div id="nodes"></div></section>
    <section style="margin-top:16px"><h2>Timeline</h2>
      <div class="filters">
        <label>Shard <select id="f-shard"><option value="">all</option></select></label>
        <label>Kind <select id="f-kind"><option value="">all</option></select></label>
        <label>Node <select id="f-node"><option value="">all</option></select></label>
        <span id="f-count"></span>
      </div>
      <ul id="timeline"></ul></section>
  </div>
  <section>
    <h2>Query</h2>
    <form id="query">
      <label for="type">Request</label>
      <select id="type"><option>Get</option><option>Neighbors</option><option>Put</option><option>Delete</option></select>
      <label for="s">Subject</label><input id="s" required>
      <label for="p">Predicate</label><input id="p">
      <label for="o">Object</label><input id="o">
      <label for="depth">Depth</label><input id="depth" type="number" min="1" max="3" value="1">
      <label for="read">Read</label>
      <select id="read"><option value="leader">leader</option><option value="follower">follower</option></select>
      <button>Send</button>
    </form>
    <p id="took"></p>
    <pre id="answer"></pre>
  </section>
</main>
<script>
// Talks to the gateway only (src/knowdes/gateway.py): /events and /request.
const KEEP = 500;
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, attrs);
  node.append(...children);
  return node;
}

// Nodes with a Control on its way, their button stays disabled until it is answered.
const pending = new Set();

function showStatus(snapshot) {
  const box = $("nodes");
  box.replaceChildren();
  const leaders = {};
  for (const st of Object.values(snapshot.nodes)) {
    // A paused or cut-off old leader still says leader, the one with the newest term counts.
    for (const r of st?.shards ?? []) {
      if (r.role === "leader" && !(leaders[r.shard]?.term > r.term)) leaders[r.shard] = r;
    }
  }
  for (const [id, st] of Object.entries(snapshot.nodes)) {
    const card = el("div", { className: "node" + (st ? "" : " down") + (st?.paused ? " paused" : "") });
    const title = el("b", {}, el("span", {}, id + (st ? (st.paused ? " (paused)" : "") : " (no answer)")));
    // Fault panel (docs/console-plan.md): pause and resume per node, sent as Control.
    if (st) {
      const action = st.paused ? "resume" : "pause";
      const button = el("button", { type: "button", textContent: action, disabled: pending.has(id) });
      Object.assign(button.dataset, { node: id, action });
      title.append(button);
    }
    card.append(title);
    for (const r of st?.shards ?? []) {
      const behind = leaders[r.shard] ? leaders[r.shard].last_applied - r.last_applied : null;
      const lag = behind > 0 ? `, ${behind} behind` : "";
      card.append(el("div", { className: "replica" },
        el("span", {}, `shard ${r.shard}`),
        el("span", { className: "role-" + r.role },
           `${r.role} t${r.term} c${r.commit_index} a${r.last_applied}${lag}`)));
    }
    box.append(card);
  }
}

// Timeline filters (design plan section 5): by shard, by kind of event and by node.
// An event without a shard (pause, up, down) belongs to every shard.
const seen = { shard: new Set(), kind: new Set(), node: new Set() };

function addOption(name, value) {
  if (value === "" || seen[name].has(value)) return;
  seen[name].add(value);
  const select = $("f-" + name);
  const options = [...select.options].slice(1).map((o) => o.value);
  options.push(value);
  options.sort((a, b) => (name === "shard" ? Number(a) - Number(b) : a.localeCompare(b)));
  select.replaceChildren(select.options[0], ...options.map((v) => el("option", { value: v, textContent: v })));
  select.value = select.dataset.value ?? "";
}

function matches(item) {
  const shard = $("f-shard").value, kind = $("f-kind").value, node = $("f-node").value;
  return (!shard || item.dataset.shard === "" || item.dataset.shard === shard)
    && (!kind || item.dataset.kind === kind)
    && (!node || item.dataset.node === node);
}

function applyFilters() {
  let shown = 0;
  const list = $("timeline");
  for (const item of list.children) {
    const show = matches(item);
    item.classList.toggle("hidden", !show);
    shown += show;
  }
  $("f-count").textContent = `${shown} of ${list.children.length}`;
}

for (const name of ["shard", "kind", "node"]) {
  $("f-" + name).addEventListener("change", (ev) => {
    ev.target.dataset.value = ev.target.value;
    applyFilters();
  });
}

function showEvent(e) {
  const time = new Date(e.time * 1000).toLocaleTimeString();
  const rest = Object.entries(e)
    .filter(([k, v]) => !["type", "time", "node", "kind", "shard"].includes(k) && v !== null)
    .map(([k, v]) => `${k}=${typeof v === "object" ? JSON.stringify(v) : v}`).join(" ");
  const shard = e.shard === null || e.shard === undefined ? "" : ` s${e.shard}`;
  const item = el("li", {}, el("span", { className: "t" }, time + " "), `${e.node}${shard} ${e.kind} ${rest}`);
  const shardId = e.shard === null || e.shard === undefined ? "" : String(e.shard);
  Object.assign(item.dataset, { shard: shardId, kind: e.kind, node: e.node });
  addOption("shard", shardId);
  addOption("kind", e.kind);
  addOption("node", e.node);
  item.classList.toggle("hidden", !matches(item));
  const list = $("timeline");
  list.prepend(item);
  while (list.children.length > KEEP) list.lastChild.remove();
  const shown = [...list.children].filter((li) => !li.classList.contains("hidden")).length;
  $("f-count").textContent = `${shown} of ${list.children.length}`;
}

function connect() {
  const source = new EventSource("/events");
  source.onopen = () => { $("conn").textContent = "connected"; };
  source.onerror = () => { $("conn").textContent = "gateway lost, retrying"; };
  source.addEventListener("status", (m) => showStatus(JSON.parse(m.data)));
  source.addEventListener("event", (m) => showEvent(JSON.parse(m.data)));
}

// The cards are rebuilt with every status, so the click is caught on the container.
$("nodes").addEventListener("click", async (ev) => {
  const button = ev.target.closest("button[data-node]");
  if (!button) return;
  const { node, action } = button.dataset;
  pending.add(node);
  button.disabled = true;
  try {
    const res = await fetch("/request", { method: "POST", body: JSON.stringify({ type: "Control", node, action }) });
    const body = await res.json();
    const r = body.reply ?? body;
    $("took").textContent = `${action} ${node}: ${body.ms ?? "?"} ms`;
    $("answer").className = r.ok ? "" : "error";
    $("answer").textContent = JSON.stringify(r, null, 2);
  } catch (err) {
    $("answer").className = "error";
    $("answer").textContent = String(err);
  } finally {
    pending.delete(node);
  }
});

$("query").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const type = $("type").value;
  const msg = { type, s: $("s").value.trim() };
  if (type === "Put" || type === "Delete") Object.assign(msg, { p: $("p").value.trim(), o: $("o").value.trim() });
  if (type === "Get" || type === "Neighbors") msg.read = $("read").value;
  if (type === "Neighbors") {
    msg.depth = Number($("depth").value);
    if ($("p").value.trim()) msg.p = $("p").value.trim();
  }
  try {
    const res = await fetch("/request", { method: "POST", body: JSON.stringify(msg) });
    const body = await res.json();
    const r = body.reply ?? body;
    const who = r.node ? ` by ${r.node} (${r.read} read, applied ${r.applied})` : "";
    $("took").textContent = `${body.ms ?? "?"} ms${who}`;
    $("answer").className = r.ok ? "" : "error";
    $("answer").textContent = JSON.stringify(r, null, 2);
  } catch (err) {
    $("answer").className = "error";
    $("answer").textContent = String(err);
  }
});

connect();
</script>
</body>
</html>
